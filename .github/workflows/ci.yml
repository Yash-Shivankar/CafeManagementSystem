name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        # Not blocking yet: the codebase is not annotated end to end, and a
        # gate nobody can pass is a gate everybody learns to ignore.
        continue-on-error: true
        run: mypy app

      - name: Tests
        # The suite runs on SQLite in memory (see tests/conftest.py), so no
        # service container is needed here.
        env:
          APP_NAME: Caelum
          ENVIRONMENT: development
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          JWT_SECRET: ci-secret-not-used-in-any-deployment
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        # A production build is part of the gate: an asset path can work in dev
        # and 404 in the build, and only a build catches that.
        run: npm run build

  migrations:
    name: Migrations apply to a real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    # The unit suite runs on SQLite, which will happily accept a migration that
    # Postgres rejects. This job proves `alembic upgrade head` works on the
    # database the product actually uses.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Upgrade, then downgrade one, then upgrade again
        env:
          APP_NAME: Caelum
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          JWT_SECRET: ci-secret-not-used-in-any-deployment
        # The down-then-up catches a migration with no working downgrade.
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: The models and the migrated schema agree
        env:
          APP_NAME: Caelum
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          JWT_SECRET: ci-secret-not-used-in-any-deployment
        # Catches a model edited without a migration written for it. The tests
        # run on SQLite created from the models, so that drift is invisible to
        # them — it shows up in production as a missing column.
        run: alembic check

  docker:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
