<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!--
      T-07: this used to preload all 26 Google Font families on every page load,
      render-blocking, to serve the one the user had actually selected. The
      selected family is now fetched by `loadFont()` once the saved setting is
      known; the rest load only when the picker is opened. Only the preconnects
      stay, so that fetch is fast when it happens.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153523" />
    <meta
      name="description"
      content="Caelum — billing, inventory, staff and payroll for independent cafes."
    />
    <title>Caelum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
