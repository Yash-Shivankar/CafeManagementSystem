# One command to bring up the whole system, including the database.
#
# cp .env.example .env   # then set the two passwords
# docker compose up --build
#
# Site -> http://localhost:5173        the landing page
# App -> http://localhost:5173/app    the product
# API -> http://localhost:8000        (docs at /docs outside production)

name: caelum

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caelum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-caelum}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published: nothing outside this network needs it, and an exposed
    # 5432 with a development password is how databases get found.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caelum} -d ${POSTGRES_DB:-caelum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        # Waits for the database to answer, not merely to have a container.
        condition: service_healthy
    environment:
      APP_NAME: Caelum
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-caelum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-caelum}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      # Uploaded employee documents must outlive the container.
      - media:/app/app/media
    ports:
      - "8000:8000"
    # Migrations run on start, not in the image build: the database does not
    # exist at build time, and a migration is a deploy step.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      # Repo root, so the image can carry both the app and landing/.
      context: .
      dockerfile: Frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db-data:
  media:
